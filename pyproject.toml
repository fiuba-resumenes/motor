[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-apuntes"
version = "0.1.0"
description = "Motor compartido para armar los apuntes de FIUBA Resumenes"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["motor_apuntes"]

[tool.setuptools.package-data]
motor_apuntes = ["*.html", "*.txt", "*.md"]
